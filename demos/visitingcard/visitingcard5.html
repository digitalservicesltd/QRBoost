<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visiting Card Preview</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0a0a0a;
    font-family: sans-serif;
}

/* Container */
.card-container {
    perspective: 1200px;
}

/* Card */
.card {
    width: 320px;
    height: 200px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
    cursor: pointer;
}

/* Flip trigger */
.card.flipped {
    transform: rotateY(180deg);
}

/* Front + Back */
.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    overflow: hidden;
    backface-visibility: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}

/* Front */
.card-front {
    background: #111;
}

/* Back */
.card-back {
    transform: rotateY(180deg);
    background: #111;
}

/* Images */
.card-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Subtle glow */
.card:hover {
    box-shadow: 0 25px 60px rgba(0,0,0,0.8);
}
</style>

</head>
<body>

<div class="card-container">
    <div class="card" id="card">

        <!-- FRONT IMAGE -->
        <div class="card-face card-front">
            <img src="vc5-front.webp" alt="Front">
        </div>

        <!-- BACK IMAGE -->
        <div class="card-face card-back">
            <img src="vc5-back.webp" alt="Back">
        </div>

    </div>
</div>

<script>
const card = document.getElementById("card");

/* Click to flip (mobile + desktop) */
card.addEventListener("click", () => {
    card.classList.toggle("flipped");
});
</script>

</body>
</html>
