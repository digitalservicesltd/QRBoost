<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visiting Card Preview</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        .card-container {
            perspective: 1200px;
        }

        .card {
            position: relative;
            width: 320px;
            height: 200px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
            border-radius: 12px;
            will-change: transform;
            /* 🔥 smooth + stable */
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            transform: translateZ(0);
            /* 🔥 KEY FIX */
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .card-front {
            z-index: 2;
        }

        .card-back {
            transform: rotateY(180deg);
            z-index: 1;
        }

        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .instruction {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 360px) {
            .card {
                width: 280px;
                height: 175px;
            }
        }
    </style>
</head>

<body>

    <div class="card-container">
        <div class="card" id="card">

            <!-- FRONT -->
            <div class="card-face card-front">
                <img src="vc5-front.webp" alt="Card Front">
            </div>

            <!-- BACK -->
            <div class="card-face card-back">
                <img src="vc5-back.webp" alt="Card Back">
            </div>

        </div>
    </div>

    <div class="instruction">Click card to flip</div>

    <script>
        const card = document.getElementById('card');

        card.addEventListener('click', () => {
            card.classList.toggle('flipped');
        });
    </script>

</body>

</html>
